name: knowledge-graph-rag-assistant

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    image: ghcr.io/ethanvillalovoz/knowledge-graph-rag-assistant-backend:latest
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_ALLOWED_ORIGINS: ${RAG_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  frontend:
    build:
      context: ./frontend/rag-app
      dockerfile: dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: ghcr.io/ethanvillalovoz/knowledge-graph-rag-assistant-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
